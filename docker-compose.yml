services:
  postgres:
    image: postgres:16-alpine
    container_name: cem-scraper-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cem}
      POSTGRES_USER: ${POSTGRES_USER:-cem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cem_local_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cem_pgdata:
